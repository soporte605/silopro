<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SiloPro</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SiloPro — sistema universal de inventario y almacenamiento inteligente."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar parpadeos.
      try {
        var t = localStorage.getItem('es-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <sp-root></sp-root>
  </body>
</html>
