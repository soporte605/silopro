# /etc/nginx/sites-available/silopro.elikarsystems.com
# Página comercial de SiloPro. La sirve el mismo contenedor web (127.0.0.1:3200):
# en este dominio la web solo muestra la landing y los avisos legales, y manda
# lo demás a app.silopro.elikarsystems.com. certbot --nginx añade el bloque 443.
server {
  listen 80;
  listen [::]:80;
  server_name silopro.elikarsystems.com www.silopro.elikarsystems.com;
  server_tokens off;

  # La API solo se usa desde la app.
  location /api/ {
    return 404;
  }

  location / {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
