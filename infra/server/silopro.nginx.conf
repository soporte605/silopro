# /etc/nginx/sites-available/app.silopro.elikarsystems.com
# Proxy HTTPS hacia el contenedor web de SiloPro (127.0.0.1:3200). certbot
# --nginx añade el bloque 443 y la redirección desde HTTP.
server {
  listen 80;
  listen [::]:80;
  server_name app.silopro.elikarsystems.com;
  server_tokens off;

  # Fotografías de hasta 8 MB (la API aplica el límite exacto).
  client_max_body_size 9m;

  location / {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
