# Si hay otro proxy delante (HTTPS en el servidor), se conserva su esquema.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    # Fotografías de hasta 8 MB (la API aplica el límite exacto).
    client_max_body_size 9m;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Recursos con hash en el nombre: caché larga.
  location ~* \.(?:js|css|woff2|svg|png)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Enrutado del lado del cliente (Angular).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
