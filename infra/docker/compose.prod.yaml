# SiloPro — servidor público detrás de un nginx que termina HTTPS.
#
#   docker compose -p silopro -f infra/docker/compose.prod.yaml --env-file /opt/silopro/shared/.env up -d --build
#
# Solo publica la web en 127.0.0.1 (SILOPRO_WEB_PORT); ni la API ni PostgreSQL
# quedan expuestos. Todas las contraseñas vienen del .env del servidor, fuera
# del repositorio (ver docs/DEPLOYMENT.md).
name: silopro

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD}
      SILOPRO_DB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-silopro.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d silopro']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: ${PUBLIC_WEB_URL:?defina PUBLIC_WEB_URL}
      DATABASE_URL: postgres://silopro:${POSTGRES_PASSWORD}@postgres:5432/silopro
      MIGRATE_ON_START: 'true'
      COOKIE_SECURE: 'true'
      UPLOADS_DIR: /data/uploads
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      # nginx del contenedor web + nginx del servidor.
      TRUST_PROXY_HOPS: 2
      # Correos (Resend). Sin clave, los correos solo se escriben en el registro.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-SiloPro <no-responder@silopro.elikarsystems.com>}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SILOPRO_WEB_PORT:-3200}:80'
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
