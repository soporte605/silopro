# SiloPro — despliegue local con Docker Compose.
#   docker compose -f infra/docker/compose.yaml up -d --build
# Web: http://localhost:8080 · API: http://localhost:3000/api/health
#
# Las credenciales de este archivo son SOLO para desarrollo local. En cualquier
# otro entorno defina POSTGRES_PASSWORD mediante un archivo .env no versionado.
name: silopro

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: silopro
      POSTGRES_USER: silopro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silopro}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U silopro -d silopro']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: http://localhost:8080
      DATABASE_URL: postgres://silopro:${POSTGRES_PASSWORD:-silopro}@postgres:5432/silopro
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api

volumes:
  pgdata:
