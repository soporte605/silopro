# SiloPro — despliegue local con Docker Compose.
#   docker compose -f infra/docker/compose.yaml up -d --build
# Web: http://localhost:8080 · API: http://localhost:3000/api/health
#
# Las credenciales de este archivo son SOLO para desarrollo local. En cualquier
# otro entorno defina POSTGRES_PASSWORD mediante un archivo .env no versionado.
name: silopro

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      SILOPRO_DB_PASSWORD: ${POSTGRES_PASSWORD:-silopro}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-silopro.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d silopro']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: http://localhost:8080
      DATABASE_URL: postgres://silopro:${POSTGRES_PASSWORD:-silopro}@postgres:5432/silopro
      MIGRATE_ON_START: 'true'
      # Local por HTTP; ponga 'true' detrás de HTTPS.
      COOKIE_SECURE: 'false'
      UPLOADS_DIR: /data/uploads
      # Origen con el que se construyen los enlaces de invitación.
      PUBLIC_WEB_URL: http://localhost:8080
    volumes:
      - uploads:/data/uploads
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
