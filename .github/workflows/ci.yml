name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Formato, lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://silopro:silopro@localhost:5432/silopro_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crear rol de aplicación sin superusuario (RLS efectiva)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE silopro LOGIN PASSWORD 'silopro' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE silopro_test OWNER silopro"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Pruebas end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: calidad
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://silopro:silopro@localhost:5432/silopro_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crear rol de aplicación y base desechable
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE silopro LOGIN PASSWORD 'silopro' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE silopro_e2e OWNER silopro"
      - run: pnpm build:packages
      - run: pnpm --filter @silopro/api build
      - run: pnpm --filter @silopro/web exec playwright install --with-deps chromium
      - run: pnpm --filter @silopro/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trazas
          path: apps/web/test-results
          retention-days: 7

  docker:
    name: Construcción de imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: calidad
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f infra/docker/compose.yaml build
